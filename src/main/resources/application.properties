# =====================================================
# Common settings (loaded by all profiles)
# =====================================================

# Application name - shown in Actuator /info and logs
spring.application.name=hello-springboot

# Embedded Tomcat port
server.port=8080

# Default active profile: dev or prod
# Override with env var SPRING_PROFILES_ACTIVE=prod in production
spring.profiles.active=dev

# Java 21 Virtual Threads (Project Loom)
# - Lightweight JVM-managed threads instead of OS platform threads
# - Non-blocking on I/O: carrier thread is released while waiting
# - Applied automatically to Spring MVC + Tomcat thread pool
spring.threads.virtual.enabled=true

# =====================================================
# Spring Boot Actuator
# =====================================================
# Expose selected endpoints (default: only health)
# health   -> /actuator/health
# info     -> /actuator/info
# beans    -> /actuator/beans  (all registered Spring beans)
# metrics  -> /actuator/metrics
management.endpoints.web.exposure.include=health,info,beans,metrics
