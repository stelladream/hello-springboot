# =====================================================
# Production profile (loaded when spring.profiles.active=prod)
# =====================================================

# --- DataSource (externalized via environment variables) ---
# Injected by docker-compose.yml or Kubernetes Secret
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: add missing tables/columns without dropping existing data
# Use validate (with Flyway/Liquibase) once schema is fully managed
spring.jpa.hibernate.ddl-auto=update

# Disable SQL logging in production (performance + security)
spring.jpa.show-sql=false

# --- Logging ---
# INFO level: minimal operational logs only
logging.level.kr.ac.hansung=INFO
