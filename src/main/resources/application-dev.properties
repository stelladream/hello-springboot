# =====================================================
# Development profile (loaded when spring.profiles.active=dev)
# =====================================================

# --- DataSource ---
# Local MySQL connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/hellodb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# create-drop: create schema on startup, drop on shutdown (fresh state every run)
spring.jpa.hibernate.ddl-auto=create-drop

# Print all SQL statements to console
spring.jpa.show-sql=true

# Format SQL output with indentation for readability
spring.jpa.properties.hibernate.format_sql=true

# --- SQL Initialization ---
# always: run data.sql even on non-embedded DB (default is never for MySQL)
spring.sql.init.mode=always
# Ensure Hibernate creates tables before data.sql runs
spring.jpa.defer-datasource-initialization=true

# --- Logging ---
# DEBUG level for this project's packages
logging.level.kr.ac.hansung=DEBUG
